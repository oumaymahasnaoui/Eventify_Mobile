name: eventify
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # Database solutions
  sqflite: ^2.3.0  # For mobile
  hive: ^2.2.3     # For web and mobile
  hive_flutter: ^1.1.0

  # Other dependencies
  path: ^1.8.3
  social_auth_buttons: ^2.0.2
  cupertino_icons: ^1.0.8
  path_provider: ^2.1.1
  google_maps_flutter: ^2.2.3
  geolocator: ^9.0.2
  image_picker: ^0.8.7+5
  image: ^3.3.0
  photofilters: ^3.0.1
  flutter_cache_manager: ^3.4.1
  permission_handler: ^11.0.1
  flutter_local_notifications: ^17.0.0
  http: ^1.2.2
  sqflite_common_ffi_web: ^0.4.2
  flutter_stripe: ^11.5.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^1.1.3
  build_runner: ^2.4.6

flutter:
  uses-material-design: true